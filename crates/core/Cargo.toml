[package]
name        = "logolig"
description = "Pure domain types and image processing services for logolig (no GUI)."
readme      = "../../README.md"
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
authors.workspace       = true
license.workspace       = true
repository.workspace    = true

# Disable automatic test discovery under tests/.
# Keeps `tests/fixtures.rs` as a shared helper without promoting it to a
# standalone integration-test binary. Trade-off to satisfy the §2.1 "no mod.rs" rule:
# instead of `tests/common/mod.rs`, each test references `tests/fixtures.rs`
# via `mod fixtures;`.
autotests               = false

[dependencies]
tiny-skia               = { workspace = true }

fast_image_resize       = { workspace = true }
ico                     = { workspace = true }
image                   = { workspace = true }
resvg                   = { workspace = true }
usvg                    = { workspace = true }

serde                   = { workspace = true }
serde_json              = { workspace = true }
thiserror               = { workspace = true }
tokio                   = { workspace = true, features = ["fs", "rt", "macros"] }
vtracer                 = { workspace = true }

[dev-dependencies]
tokio                   = { workspace = true }
usvg                    = { workspace = true }

# Each integration test is declared explicitly (complements autotests = false).
# `fixtures.rs` is intentionally excluded here.
[[test]]
name = "export_plan"
path = "tests/export_plan.rs"

[[test]]
name = "exporter"
path = "tests/exporter.rs"

[[test]]
name = "decode_webp"
path = "tests/decode_webp.rs"

[[test]]
name = "decode_jpeg"
path = "tests/decode_jpeg.rs"

[[test]]
name = "html_snippet"
path = "tests/html_snippet.rs"

[[test]]
name = "ingest"
path = "tests/ingest.rs"

[[test]]
name = "preview"
path = "tests/preview.rs"

[[test]]
name = "rasterize"
path = "tests/rasterize.rs"

[[test]]
name = "resize"
path = "tests/resize.rs"

[[test]]
name = "vectorize"
path = "tests/vectorize.rs"

[[test]]
name = "persisted_settings"
path = "tests/persisted_settings.rs"

[[test]]
name = "transparency_audit"
path = "tests/transparency_audit.rs"

[[test]]
name = "manifest_writer"
path = "tests/manifest_writer.rs"

[[test]]
name = "monochrome"
path = "tests/monochrome.rs"

[lints]
workspace = true
