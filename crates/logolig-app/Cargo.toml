[package]
name = "logolig-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Local-first, ABDD-compliant favicon generator GUI (binary: logolig)."

# バイナリ名は `logolig`。
# パッケージ名と異なる名前を `[[bin]]` で宣言することで、
# `cargo install logolig-app` した時に `logolig` コマンドとして使える。
[[bin]]
name = "logolig"
path = "src/main.rs"

[dependencies]
logolig-core.workspace = true
iced.workspace = true
snora.workspace = true

# ファイルピッカー (キーボード代替経路, §5.1, §12)
rfd.workspace = true

[lints]
workspace = true
