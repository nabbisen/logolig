[package]
name = "logolig-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Local-first, ABDD-compliant favicon generator GUI (binary: logolig)."

# バイナリ名は `logolig`。
# パッケージ名と異なる名前を `[[bin]]` で宣言することで、
# `cargo install logolig-app` した時に `logolig` コマンドとして使える。
[[bin]]
name = "logolig"
path = "src/main.rs"

[dependencies]
logolig-core.workspace = true
iced.workspace = true
snora.workspace = true

# ファイルピッカー (キーボード代替経路, §5.1, §12)
rfd.workspace = true

# v1.4.0: 設定永続化のネイティブ実装。
# OS 標準 config dir 自動解決 + typed ConfigManager<T> + read-modify-write update()。
app-json-settings.workspace = true

# v1.5.0: 翻訳 (英語のみ、 v1.6 で日本語追加)
logolig-i18n = { path = "../logolig-i18n" }

# v1.16.0: アセットカードのサムネ生成 (PNG / ICO デコード) で使用。
# ICO サポートを含めるため `ico` feature を追加。 PNG は workspace 共通の
# image dep が既に有効化済 だが、 logolig-app から直接呼ぶので個別に依存を
# 書く。
image = { workspace = true, features = ["png", "ico"] }

# v1.16.0: 「すべてダウンロード (ZIP)」 ボタンの実装で使用。 全アセットを
# in-memory で zip 化してから rfd で書き出す。
zip = { version = "2", default-features = false, features = ["deflate"] }

[lints]
workspace = true
