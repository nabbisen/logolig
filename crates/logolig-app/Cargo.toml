[package]
name = "logolig-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Local-first, ABDD-compliant favicon generator GUI (binary: logolig)."

# Binary name is `logolig`.
# Declaring a binary name different from the package name via `[[bin]]`
# means `cargo install logolig-app` provides the `logolig` command.
[[bin]]
name = "logolig"
path = "src/main.rs"

[dependencies]
logolig-core.workspace = true
iced.workspace = true
snora.workspace = true

# File picker (keyboard alternative path, §5.1, §12)
rfd.workspace = true

# v1.4.0: native implementation of settings persistence.
# Automatic OS config-dir resolution + typed ConfigManager<T> + read-modify-write update().
app-json-settings.workspace = true

# v1.5.0: translations (English only; Japanese added in v1.6)
logolig-i18n = { path = "../logolig-i18n" }

# v1.16.0: used for asset-card thumbnail generation (PNG / ICO decode).
# Adds the `ico` feature for ICO support. PNG is already enabled by the
# shared workspace image dep, but logolig-app calls it directly, so the
# dependency is declared here too.
image = { workspace = true, features = ["png", "ico"] }

# v1.16.0: used for the "Download all (ZIP)" button. Zips all assets
# in memory, then writes them out via rfd.
zip = { version = "2", default-features = false, features = ["deflate"] }

[lints]
workspace = true
