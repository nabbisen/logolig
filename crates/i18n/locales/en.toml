# --- JPEG support (v1.11.0) ---
# JPEG-specific educational warning. The format itself cannot store an alpha
# channel, so the generic "no transparency detected" warning would be
# misleading — it sounds like the user did something wrong with their PNG.
# This message is honest about the format limit and recommends PNG instead.
toast_jpeg_input_title = "JPEG cannot have transparency"
toast_jpeg_input_body = "Logolig will use this image, but JPEG cannot store a transparent background. For a favicon that adapts to dark and light browser tabs, export your logo to PNG with the background cut out, then load that here."

