# --- JPEG support (v1.11.0) ---
# JPEG-specific educational warning. The format itself cannot store an alpha
# channel, so the generic "no transparency detected" warning would be
# misleading — it sounds like the user did something wrong with their PNG.
# This message is honest about the format limit and recommends PNG instead.
toast_jpeg_input_title = "JPEG cannot have transparency"
toast_jpeg_input_body = "Logolig will use this image, but JPEG cannot store a transparent background. For a favicon that adapts to dark and light browser tabs, export your logo to PNG with the background cut out, then load that here."
# RFC 014: the name suggests another format than the content. The content decides; one notice,
# and for a JPEG it is followed, in the same toast, by the tail sentence (the advisory above
# without its opening sentence).
toast_format_mismatch_title = "The file name does not match its content"
toast_format_mismatch_body = "The content is {detected} (the name says {named}), and Logolig uses it as {detected}."
toast_format_mismatch_jpeg_tail = "JPEG cannot store a transparent background; for a favicon that adapts to dark and light browser tabs, export your logo as PNG with the background cut out, then load that here."
# RFC 012: inline messages under a web manifest field, and the notice for a settings file with bad values.
web_manifest_color_error = "Use a color like #1A2B3C or #1AB"
web_manifest_name_error = "Enter a name"
toast_manifest_reset_title = "Web manifest settings were reset"
toast_manifest_reset_body = "Some web manifest values in your settings were not valid, so they were set back to their defaults."
toast_non_square_input_title = "Your logo is not square"
toast_non_square_input_body = "It is shown in full, with empty space around it, so the icon may look small. A square version of your logo gives a larger icon."
toast_svg_parts_title = "Some parts of your SVG are not shown"
toast_svg_images_body = "It refers to image files on your computer. For your safety Logolig does not read them. Embed the images in the SVG to include them."
toast_svg_text_body = "Logolig does not draw text in SVG files yet. Convert the text to outlines (paths) in your design tool and load the SVG again."

