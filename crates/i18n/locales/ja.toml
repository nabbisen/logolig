# logolig 日本語辞書 (v1.6.0)
#
# キーは logolig (core) の `MessageKey` enum を snake_case にしたもの。
# プレースホルダは英語版と同じ名前 ({name} 形式) を使う。
# 翻訳ポリシー:
#   - ラベル類は体言止め (例: 「リサイズアルゴリズム」 ではなく「Resize algorithm」 の自然訳)
#   - 説明文は「です・ます」 体ではなく簡潔な常体 (UX文言として読みやすさ重視)
#   - 技術用語 (PNG / SVG / vtracer / favicon / favicon.ico 等) は英語のまま
#   - ボタンは命令形/体言止めの短い形 (例: 「閉じる」 「リセット」)

