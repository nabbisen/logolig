# --- JPEG サポート (v1.11.0) ---
# JPEG 専用の教育的警告。 JPEG 形式は本来 alpha チャネルを持てないため、
# 通常の「透過部分なし」 警告 (ユーザが PNG を作る時に間違えたかのように
# 響く) ではなく、 「JPEG という形式の制約」 を率直に伝えて PNG への変換
# を勧める。
toast_jpeg_input_title = "JPEG は透過を表現できません"
toast_jpeg_input_body = "この画像も使えますが、 JPEG 形式は透過背景を保存できません。 ダーク・ライト両方のブラウザタブに馴染む favicon にするには、 ロゴを背景切り抜きの PNG として書き出してから読み込んでください。"
# RFC 014: ファイル名が示す形式と中身が違う場合の通知 (中身が優先)。 JPEG のときは上の JPEG の説明が同じトーストに続く。
toast_format_mismatch_title = "ファイル名と中身が一致しません"
toast_format_mismatch_body = "中身は {detected} です (ファイル名は {named} を示しています)。 Logolig は {detected} として扱います。"
toast_format_mismatch_jpeg_tail = "JPEG 形式は透過背景を保存できません。 ダーク・ライト両方のブラウザタブに馴染む favicon にするには、 ロゴを背景切り抜きの PNG として書き出してから読み込んでください。"
# RFC 012: Web マニフェストの入力欄の下に出す説明と、 設定ファイルに不正な値があったときの通知。
web_manifest_color_error = "#1A2B3C や #1AB のような色を指定してください"
web_manifest_name_error = "名前を入力してください"
toast_manifest_reset_title = "Web マニフェストの設定を初期化しました"
toast_manifest_reset_body = "設定ファイルの Web マニフェストの値に正しくないものがあったため、 既定値に戻しました。"
toast_non_square_input_title = "ロゴが正方形ではありません"
toast_non_square_input_body = "ロゴ全体を表示するため、アイコンの周りに余白が付きます。正方形のロゴ画像を用意すると、アイコンを大きく表示できます。"
toast_svg_parts_title = "SVG の一部が表示されません"
toast_svg_images_body = "SVG がこのコンピューター上の画像ファイルを参照しています。安全のため、Logolig はそれらを読み込みません。画像を SVG に埋め込むと反映されます。"
toast_svg_text_body = "Logolig は SVG 内の文字をまだ描画できません。デザインツールで文字をアウトライン化（パス化）してから、SVG を読み込み直してください。"

