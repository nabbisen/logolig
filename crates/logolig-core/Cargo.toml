[package]
name = "logolig-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Pure domain types and image processing services for logolig (no GUI)."
# tests/ 配下の自動テスト発見を無効化する。
# `tests/fixtures.rs` を共有ヘルパとして残しつつ、 個別の integration test
# バイナリには昇格させたくないため。 §2.1 の `mod.rs` 禁止規約と両立させる
# ためのトレードオフ: `tests/common/mod.rs` は使わず、 `tests/fixtures.rs` を
# `mod fixtures;` から参照する。
autotests = false

[dependencies]
thiserror.workspace = true

# 画像処理コア
image.workspace = true
fast_image_resize.workspace = true
resvg.workspace = true
tiny-skia.workspace = true
usvg.workspace = true
ico.workspace = true
tokio.workspace = true

# v1.2.0: ラスタ → SVG ベクトル化
vtracer.workspace = true

# v1.4.0: ドメイン型の serialize/deserialize (永続化のため)
serde.workspace = true

[dev-dependencies]
# 非同期 ingest テストでランタイムが必要
tokio = { workspace = true, features = ["rt", "macros"] }
# v1.2.0: vectorize 出力の round-trip テストで使う (usvg で読み戻せること)
usvg = { workspace = true }
# v1.4.0: PersistedSettings の round-trip / default テストで使う。
# テスト固有の InMemoryStore が serde_json を必要とするため dev-dep。
# logolig-core 自体は serde_json を使わない (実装は呼び出し側 = logolig-app に委ねる)。
serde_json = "1"

# 各 integration test を明示宣言する (autotests = false の補完)。
# `fixtures.rs` は意図的にここに含めない。
[[test]]
name = "export_plan"
path = "tests/export_plan.rs"

[[test]]
name = "exporter"
path = "tests/exporter.rs"

[[test]]
name = "decode_webp"
path = "tests/decode_webp.rs"

[[test]]
name = "html_snippet"
path = "tests/html_snippet.rs"

[[test]]
name = "ingest"
path = "tests/ingest.rs"

[[test]]
name = "preview"
path = "tests/preview.rs"

[[test]]
name = "rasterize"
path = "tests/rasterize.rs"

[[test]]
name = "resize"
path = "tests/resize.rs"

[[test]]
name = "vectorize"
path = "tests/vectorize.rs"

[[test]]
name = "persisted_settings"
path = "tests/persisted_settings.rs"

[[test]]
name = "transparency_audit"
path = "tests/transparency_audit.rs"

[lints]
workspace = true
