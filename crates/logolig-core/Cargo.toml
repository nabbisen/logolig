[package]
name = "logolig-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Pure domain types and image processing services for logolig (no GUI)."
# Disable automatic test discovery under tests/.
# Keeps `tests/fixtures.rs` as a shared helper without promoting it to a
# standalone integration-test binary. Trade-off to satisfy the §2.1 "no mod.rs" rule:
# instead of `tests/common/mod.rs`, each test references `tests/fixtures.rs`
# via `mod fixtures;`.
autotests = false

[dependencies]
thiserror.workspace = true

# Image-processing core
image.workspace = true
fast_image_resize.workspace = true
resvg.workspace = true
tiny-skia.workspace = true
usvg.workspace = true
ico.workspace = true
tokio.workspace = true

# v1.2.0: raster → SVG vectorisation
vtracer.workspace = true

# v1.4.0: serialize/deserialize for domain types (persistence)
serde.workspace = true

# v1.8.0: Web manifest (manifest.webmanifest) generation.
# Was a dev-dep since v1.4 (PersistedSettings round-trip tests),
# promoted to a runtime feature in v1.8. No duplicate dev-dep needed (declared once in the workspace).
serde_json.workspace = true

[dev-dependencies]
# Async ingest tests require a runtime
tokio = { workspace = true, features = ["rt", "macros"] }
# v1.2.0: used in vectorise output round-trip tests (must re-parse via usvg)
usvg = { workspace = true }

# Each integration test is declared explicitly (complements autotests = false).
# `fixtures.rs` is intentionally excluded here.
[[test]]
name = "export_plan"
path = "tests/export_plan.rs"

[[test]]
name = "exporter"
path = "tests/exporter.rs"

[[test]]
name = "decode_webp"
path = "tests/decode_webp.rs"

[[test]]
name = "decode_jpeg"
path = "tests/decode_jpeg.rs"

[[test]]
name = "html_snippet"
path = "tests/html_snippet.rs"

[[test]]
name = "ingest"
path = "tests/ingest.rs"

[[test]]
name = "preview"
path = "tests/preview.rs"

[[test]]
name = "rasterize"
path = "tests/rasterize.rs"

[[test]]
name = "resize"
path = "tests/resize.rs"

[[test]]
name = "vectorize"
path = "tests/vectorize.rs"

[[test]]
name = "persisted_settings"
path = "tests/persisted_settings.rs"

[[test]]
name = "transparency_audit"
path = "tests/transparency_audit.rs"

[[test]]
name = "manifest_writer"
path = "tests/manifest_writer.rs"

[[test]]
name = "monochrome"
path = "tests/monochrome.rs"

[lints]
workspace = true
