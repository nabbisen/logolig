# logolig English dictionary (v1.5.0)
#
# Keys are the snake_case version of `MessageKey` enum variants in logolig-core.
# Placeholders use `{name}` syntax, replaced at runtime by Translator using
# args from AppError::args() or t_args() callers.
#
# When adding a key here, also add the matching variant to MessageKey in
# logolig-core/src/message_key.rs. The Translator's exhaustive match will
# fail to compile until both sides agree.

