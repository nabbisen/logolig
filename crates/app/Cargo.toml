[package]
name        = "logolig-app"
description = "Local-first, ABDD-compliant favicon generator GUI (binary: logolig)."
readme      = "../../README.md"
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
authors.workspace       = true
license.workspace       = true
repository.workspace    = true

# The headless-test fonts are fixtures, not part of the published package (RFC 035).
exclude     = ["test-assets/"]

# Binary name is `logolig`.
[[bin]]
name = "logolig"
path = "src/main.rs"

[dependencies]
logolig                 = { workspace = true }
logolig-i18n            = { workspace = true }

iced                    = { workspace = true }
snora                   = { workspace = true }

rfd                     = { workspace = true }
app-json-settings       = { workspace = true }

chrono                  = { workspace = true }
# RFC 030: `spawn_blocking` for CPU-bound tasks. Already in the tree through iced's `tokio` feature.
tokio                   = { workspace = true, features = ["rt"] }
image                   = { workspace = true }
zip                     = { workspace = true }

[dev-dependencies]
iced_test               = { workspace = true }

[lints]
workspace = true
