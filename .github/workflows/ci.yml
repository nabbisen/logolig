name: CI

# Release gates run on every pull request and every push to main (RFC 020, phase 1).
# Job names (fmt, clippy, test, msrv, audit) are a contract: branch protection and
# the RFC 020 phase-2 handoff refer to them. Do not rename them.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: no job receives more than read access to the repository.
permissions:
  contents: read

# Cancel superseded runs of a pull request, never a run on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Version of cargo-audit installed by the `audit` job. Pinned so runs are reproducible.
  CARGO_AUDIT_VERSION: "0.22.2"

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal -c rustfmt
          rustup default stable
          rustc --version
          cargo --version
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Linux build prerequisites of the GUI stack (iced / winit / wgpu / rfd):
      #   pkg-config          lets build scripts locate system libraries
      #   libfontconfig1-dev  font discovery
      #   libxkbcommon-dev    keyboard handling (winit)
      #   libwayland-dev      Wayland client libraries (winit)
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libxkbcommon-dev libwayland-dev
      - name: Install toolchain
        id: toolchain
        run: |
          rustup toolchain install stable --profile minimal -c clippy
          rustup default stable
          echo "version=$(rustc --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"
          cargo --version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-clippy-${{ steps.toolchain.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-clippy-${{ steps.toolchain.outputs.version }}-
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Linux build prerequisites of the GUI stack (iced / winit / wgpu / rfd):
      #   pkg-config          lets build scripts locate system libraries
      #   libfontconfig1-dev  font discovery
      #   libxkbcommon-dev    keyboard handling (winit)
      #   libwayland-dev      Wayland client libraries (winit)
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libxkbcommon-dev libwayland-dev
      - name: Install toolchain
        id: toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          echo "version=$(rustc --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"
          cargo --version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-${{ steps.toolchain.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-test-${{ steps.toolchain.outputs.version }}-
      - run: cargo test --workspace --all-features --locked

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Linux build prerequisites of the GUI stack (iced / winit / wgpu / rfd):
      #   pkg-config          lets build scripts locate system libraries
      #   libfontconfig1-dev  font discovery
      #   libxkbcommon-dev    keyboard handling (winit)
      #   libwayland-dev      Wayland client libraries (winit)
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libxkbcommon-dev libwayland-dev
      - name: Install MSRV toolchain
        id: toolchain
        run: |
          # The single source of truth is `rust-version` in the workspace manifest.
          msrv="$(sed -n 's/^rust-version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' Cargo.toml)"
          test -n "$msrv" || { echo "rust-version not found in Cargo.toml" >&2; exit 1; }
          rustup toolchain install "$msrv" --profile minimal
          rustup default "$msrv"
          echo "version=$(rustc --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"
          cargo --version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-msrv-${{ steps.toolchain.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-msrv-${{ steps.toolchain.outputs.version }}-
      - run: cargo check --workspace --all-targets --all-features --locked

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        id: toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          echo "version=$(rustc --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"
          cargo --version
      # Only the installed binary is cached; the advisory database is always fetched fresh.
      # The cache is saved right after installation (not at job end), so a red audit
      # result, which is a legitimate outcome, does not prevent the binary from being cached.
      - id: audit-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-${{ env.CARGO_AUDIT_VERSION }}-${{ steps.toolchain.outputs.version }}
      - name: Install cargo-audit
        if: steps.audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked
      - name: Save cargo-audit binary
        if: steps.audit-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-${{ env.CARGO_AUDIT_VERSION }}-${{ steps.toolchain.outputs.version }}
      - run: cargo audit --version
      - run: cargo audit
