[workspace]
resolver = "3"
members = [
    "crates/app",
    "crates/core",
    "crates/i18n",
]

[workspace.package]
version = "1.26.1"
edition         = "2024"
rust-version    = "1.85"
license         = "Apache-2.0"
authors         = ["nabbisen"]
repository      = "https://github.com/nabbisen/logolig"

[workspace.dependencies]
logolig                 = { version = "1", path = "crates/core" }
logolig-i18n            = { version = "1", path = "crates/i18n" }

iced                    = { version = "0.14", features = ["tokio", "image"] }
snora                   = { version = "0.25", default-features = false, features = ["widgets", "lucide-icons"] }

app-json-settings       = "2"
rfd                     = "0.15"
sys-locale              = "0.3"
tiny-skia               = "0.11"

fast_image_resize       = { version = "5", features = ["image"] }
ico                     = "0.4"
image                   = { version = "0.25", default-features = false, features = ["png", "webp", "jpeg", "ico"] }
resvg                   = "0.45"
usvg                    = "0.45"

chrono                  = { version = "0.4", default-features = false, features = ["clock"] }
serde                   = { version = "1", features = ["derive"] }
serde_json              = "1"
thiserror               = "2"
tokio                   = "1"
toml                    = "0.8"
vtracer                 = "0.6"
zip                     = { version = "2", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"
