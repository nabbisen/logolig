# Workspace root.
#
# 構造の意図 (§16, §3.1):
# - logolig-core: 純粋なドメイン + 画像処理。iced/snora 非依存。
# - logolig-app : GUI バイナリ。iced 0.14 + snora 0.4 + logolig-core を結線する。
#                 バイナリ名は `logolig` (cargo install で `logolig` コマンドとして使える)。
#
# 「ドメイン/サービス/UI 分離」を慣習ではなく依存グラフで強制する。
# logolig-core から iced を import しようとするとコンパイルエラーになる。

[workspace]
resolver = "3"
members = ["crates/logolig-core", "crates/logolig-app", "crates/logolig-i18n"]

[workspace.package]
version = "1.10.0"
edition = "2024"
rust-version = "1.85"
authors = ["nabbisen <nabbisen@scqr.net>"]
license = "Apache-2.0"
repository = "https://github.com/nabbisen/logolig"
publish = false

[workspace.dependencies]
# 共通基盤
thiserror = "2"

# GUI ランタイム + フレームワーク
# 元の指示書は "snora 0.4 (iced ベース)" を指定。snora 0.4 は iced 0.14 を要求する。
iced  = { version = "0.14", features = ["tokio", "image"] }
# snora は lucide-icons / svg-icons feature を持つが、現状アイコン未使用。
# また snora 0.4.1 + lucide-icons 1.9.0 + iced 0.14 の組み合わせは
# snora 上流側で型不整合があり (widget/icon.rs:27)、フィーチャ無効化で回避する。
# Icon::Text は無条件で使えるため、必要時はそれで代替する。
snora = { version = "0.4", default-features = false }

# Step 2: 画像処理コア (logolig-core 専用)
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
fast_image_resize = { version = "5", features = ["image"] }
resvg = "0.45"
tiny-skia = "0.11"
usvg = "0.45"
ico = "0.4"
tokio = { version = "1", features = ["fs", "rt", "macros"] }

# v1.2.0: ラスタ → SVG ベクトル化 (logolig-core 専用)
# vtracer 0.6.5 + visioncortex 0.8.10。 ライセンス MIT/Apache-2.0、 WASM 互換 (公式 webapp 実績)。
vtracer = "0.6"

# v1.4.0: 設定永続化
# serde は logolig-core で ExportPlan 等を Serialize/Deserialize するため。
# app-json-settings v2 は logolig-app の NativeStore 実装でラップする
# (typed ConfigManager<T> 形、 OS 標準 config dir 自動解決、 read-modify-write `update()`)。
serde = { version = "1", features = ["derive"] }
app-json-settings = "2"

# v1.5.0: i18n 基盤
# sys-locale: OS のロケール検出 (LANG / macOS API / Windows API を吸収)。 約 60KB、 軽量。
# toml: logolig-i18n の辞書ファイル (en.toml 等) のパース。 v2 WASM でも問題なく動く。
sys-locale = "0.3"
toml = "0.8"

# v1.8.0: Web manifest 出力で JSON シリアライズに使用。
# logolig-core では今まで dev-dep として InMemoryStore のテストで使っていたが、
# v1.8 で本体機能 (manifest.webmanifest) に必要となるため runtime dep へ昇格。
serde_json = "1"

# Step 2: ファイルピッカー (logolig-app 専用、§5.1 の代替経路)
rfd = "0.15"

# クレート間参照
logolig-core = { path = "crates/logolig-core" }

[workspace.lints.rust]
# §2.1 「unsafe は原則禁止」をビルド時強制。
unsafe_code = "forbid"
